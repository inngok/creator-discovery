name: CI and VPS deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTING: '1'
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q app main.py tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

  deploy:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.DEPLOY_BRANCH || github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy tested commit
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          COMMIT: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || github.event.repository.default_branch }}
          API_SERVICE: ${{ vars.VPS_API_SERVICE }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}" "${VPS_USER:?Missing VPS_USER}" "${DEPLOY_PATH:?Missing VPS_DEPLOY_PATH}"
          : "${API_SERVICE:?Missing VPS_API_SERVICE}"
          printf -v remote_command 'bash -s -- %q %q %q %q' "$DEPLOY_PATH" "$COMMIT" "$DEPLOY_BRANCH" "$API_SERVICE"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$remote_command" < scripts/deploy.sh
